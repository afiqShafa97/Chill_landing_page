<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beranda</title>

    <!-- FONT (same as login & register) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body class="home-bg">
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="nav-left">
        <img src="./assets/svg/chill-logo.svg" alt="Chill Logo" class="nav-logo" />
        <ul class="nav-menu">
          <li>Series</li>
          <li>Film</li>
          <li>Daftar Saya</li>
        </ul>
      </div>

      <div class="nav-right">
        <img src="./assets/images/profile.png" alt="Profile" class="profile-img" />
      </div>
    </nav>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-overlay">
        <h1>Film, Acara TV, dan lebih banyak lagi</h1>
        <p>Nikmati tontonan terbaik kapan saja</p>
        <button class="hero-btn">Mulai Menonton</button>
      </div>
    </section>

    <!-- CONTENT -->
    <main class="content">
      <!-- ROW -->
      <section class="movie-row">
        <h2>Trending Sekarang</h2>

        <div class="movie-list">
          <!-- CARD -->
          <div class="movie-card">
            <img src="./assets/images/movie1.png" alt="Movie 1" />
            <div class="movie-hover">
              <h3>Judul Film</h3>
              <p>2024 • Action</p>
              <button>▶ Play</button>
            </div>
          </div>

          <div class="movie-card">
            <img src="./assets/images/movie2.png" alt="Movie 2" />
            <div class="movie-hover">
              <h3>Judul Film</h3>
              <p>2023 • Drama</p>
              <button>▶ Play</button>
            </div>
          </div>

          <div class="movie-card">
            <img src="./assets/images/movie3.png" alt="Movie 3" />
            <div class="movie-hover">
              <h3>Judul Film</h3>
              <p>2022 • Thriller</p>
              <button>▶ Play</button>
            </div>
          </div>

          <div class="movie-card">
            <img src="./assets/images/movie4.png" alt="Movie 4" />
            <div class="movie-hover">
              <h3>Judul Film</h3>
              <p>2024 • Sci-Fi</p>
              <button>▶ Play</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
