<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="register-bg">
    <div class="login-card">
      <img
        src="./assets/svg/chill-logo.svg"
        alt="Chill Logo"
        class="gambar-logo"
      />

      <h1>Daftar</h1>
      <p>Selamat datang!</p>

      <form>
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          placeholder="Masukkan username"
          required
        />

        <label for="password">Kata Sandi</label>
        <div class="password-wrapper">
          <input
            id="password"
            type="password"
            placeholder="Masukkan kata sandi"
            required
          />
          <img
            src="./assets/svg/eye-off.svg"
            alt="Hide Password"
            class="eye-icon"
          />
        </div>

        <div class="links">
          <div class="link-kiri">
            <span>Sudah punya akun? </span><a href="./login.html">Masuk</a>
          </div>
          <p>Lupa kata sandi?</p>
        </div>

        <button type="submit">Daftar</button>
      </form>

      <p class="divider">Atau</p>

      <button class="google-btn">
        <img src="./assets/svg/google.svg" alt="Google" />
        Daftar dengan Google
      </button>
    </div>
  </body>
</html>
